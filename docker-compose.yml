services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edm
      POSTGRES_PASSWORD: edm
      POSTGRES_DB: edm
    ports:
      - "5432:5432"
    volumes:
      - edm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edm -d edm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edm_pgdata:
